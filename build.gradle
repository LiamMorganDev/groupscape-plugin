plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.groupscape.GroupScapeTrackerPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.groupscape'
version = '1.7.1'

// The runtime "GroupScape Tracker vX started!" line (PluginVersion.get()) used to read a
// hand-maintained version.properties that nobody remembered to bump alongside CHANGELOG.md - it
// drifted for weeks (stuck reporting 1.8.5 while the changelog moved on to 1.8.39+), making the
// log line useless for telling which fixes are actually running. Generating it straight from the
// changelog's newest "## [x.y.z]" header removes the second, disconnected source of truth.
def changelogVersion = providers.provider {
	file('CHANGELOG.md').readLines()
			.find { it.startsWith('## [') }
			.with { (it =~ /## \[(.+?)\]/)[0][1] }
}

def versionPropertiesDir = layout.buildDirectory.dir('generated/resources/version')

tasks.register('generateVersionProperties') {
	def outDir = versionPropertiesDir
	def ver = changelogVersion
	inputs.file(file('CHANGELOG.md'))
	outputs.dir(outDir)
	doLast {
		def dir = new File(outDir.get().asFile, 'com/groupscape')
		dir.mkdirs()
		new File(dir, 'version.properties').text = "version=${ver.get()}\n"
	}
}

sourceSets.main.resources.srcDir(versionPropertiesDir)
tasks.named('processResources') { dependsOn('generateVersionProperties') }

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea",
		"--add-opens", "java.base/java.lang=ALL-UNNAMED",
		"--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
		"--add-opens", "java.base/java.util=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}